l_english:
 BM_HISTORY_TITLE:0 "Brief History"
 GATHERING_STORM_NAME:0 "The Long Twilight"
 GATHERING_STORM_DESC:0 "The Cold War has not ended, only changed its shape. The Soviets still hold their bloc, but the grip weakens as Eastern capitals whisper of autonomy. Germany trembles in crisis, the Rhineland contested between east and west, while Yugoslavia staggers on as a hollow shell, a zombie state kept alive by inertia. The conflict is no longer fought with tanks and treaties, but with servers, currencies, and networks. Moscow’s Comnet eclipses Washington’s platforms, the ruble trades above the dollar, and hardliners toy with market socialism while clinging to their roots. The world drifts into twilight, waiting for the next rupture."
 ENG_GATHERING_STORM_DESC:0 "Britain still reels from the recessions of 2008 and 2010, austerity scars etched into every community. The Liberal Democrats hold power, promising reform, yet the Joint Authority of 1998 remains unresolved in Northern Ireland. Political tensions rise as communists gain support, their rallies swelling, their voices sharper, their presence no longer dismissed as fringe. The empire is gone, the Commonwealth restless, and the promises of renewal fragile. Britain faces not triumph but uncertainty, caught between reform, unrest, and the shadows of its own decline."
 OTHER_GATHERING_STORM_DESC:0 "Across the globe, nations great and small are caught in the twilight. The Soviets experiment with digital dominance, America struggles to hold its alliances, and the European Community fractures under debt and division. Some cling to old ideologies, others search for autonomy, but all know the balance is shifting. The Cold War is no longer fought in battlefields, but in invisible spaces where power now resides. The twilight deepens, and none can escape its reach."
