### events ###
sovietflavor.2.t: "Discovery Family Announces Soviet Branch"
sovietflavor.2.desc: "For the first time in over forty-five years, a Western TV show has made it onto Soviet screens. My Little Pony: Friendship Is Magic started airing on COMNET after months of negotiations with Discovery Family. The show quickly caught people’s attention, with many calling Season 5’s The Cutie Map episodes some of the best yet. Starlight Glimmer became an instant favorite, admired for her cleverness and determination. Officials are keeping a close eye, nervous about what influence even a cartoon might have. Meanwhile, viewers across forums and fan groups are talking about friendship, loyalty, and second chances in ways the country hasn’t seen in decades."
sovietflavor.2.a: "Ja ljublju Startrix"

